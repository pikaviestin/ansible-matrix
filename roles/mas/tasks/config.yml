---

- name: Ensure MAS config directory exists
  ansible.builtin.file:
    path: "{{ mas_config_path }}"
    state: directory
    owner: root
    group: "{{ mas_container_uid }}"
    mode: '0750'

- name: Ensure MAS private directory exists
  ansible.builtin.file:
    path: "{{ mas_private_path }}"
    state: directory
    owner: root
    group: "{{ mas_container_uid }}"
    mode: '0750'

- name: Ensure MAS signing key exists
  community.crypto.openssl_privatekey:
    path: "{{ mas_signing_key_file }}"
    type: RSA
    size: 2048
    owner: root
    group: "{{ mas_container_uid }}"
    mode: '0640'
  notify: Restart mas

- name: Ensure MAS config is in place
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ mas_config_path }}/config.yaml"
    owner: root
    group: "{{ mas_container_uid }}"
    mode: '0640'
  notify: Restart mas
