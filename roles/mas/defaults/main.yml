---

mas_enabled: false
mas_install_method: podman

# Host packages: podman, plus python cryptography for community.crypto key generation
mas_host_packages:
  - podman
  - python3-cryptography

# Container settings
mas_version: "1.27.0"
mas_container_image: "ghcr.io/element-hq/matrix-authentication-service:{{ mas_version }}"
mas_container_name: matrix-mas
# host networking keeps MAS reachable on localhost for synapse and nginx,
# and lets MAS reach synapse and postgres on localhost
mas_container_network: host
# UID the MAS image runs as (distroless nonroot)
mas_container_uid: 65532
mas_container_timeout_start_sec: 300
# Extra "host:container[:options]" volumes, e.g. for files referenced by mas_extra_config
mas_container_extra_volumes: []

# Paths
mas_config_path: /etc/matrix-mas
mas_private_path: "{{ mas_config_path }}/private"
mas_signing_key_file: "{{ mas_private_path }}/signing.key"
mas_signing_key_id: rsa-01

# Listeners
mas_bind_address: 127.0.0.1
mas_port: 8007
mas_internal_port: 8081
mas_trusted_proxies:
  - 127.0.0.1/8
  - ::1/128

# URLs
mas_public_base: "https://{{ mas_domain | default('') }}/"
mas_issuer: "{{ mas_public_base }}"
# Changing the issuer of a running MAS invalidates all sessions. The role refuses unless this is true.
mas_issuer_allow_change: false

# Synapse integration
mas_matrix_homeserver: "{{ matrix_domain | default('') }}"
mas_synapse_endpoint: http://localhost:8008/

# Secrets
# Empty means: reuse the one from the existing config.yaml, or generate one on first install.
mas_encryption_secret: ""
# Changing the encryption secret makes all encrypted data unreadable. The role refuses unless this is true.
mas_encryption_secret_allow_change: false
# Override the signing keys (MAS secrets.keys list). Empty means: keep migrated keys, or generate one RSA key.
mas_secrets_keys: []

# Database. When mas_psql_user is empty the database section of a migrated config is kept as is.
mas_psql_host: localhost
mas_psql_port: 5432
mas_psql_user: "{{ psql_dbs['mas']['user'] if (psql_dbs is defined and 'mas' in psql_dbs) else '' }}"
mas_psql_pw: "{{ psql_dbs['mas']['password'] if (psql_dbs is defined and 'mas' in psql_dbs) else '' }}"
mas_psql_db: "{{ mas_psql_user }}"

# Optional verbatim config sections. Empty means: keep the migrated section, or use the MAS default.
mas_passwords: {}
mas_email: {}
mas_upstream_oauth2_providers: []

# Hide task output that contains secrets. Set to false to debug config validation errors.
mas_no_log: true

# Any extra top-level MAS config keys, merged recursively over everything else
mas_extra_config: {}

# Migration from a non-container (binary / systemd) MAS install
# Unit files of a previous install that get stopped, disabled and moved to the backup path
mas_legacy_service_names:
  - matrix-mas.service
  - matrix-authentication-service.service
  - mas.service
  - mas-cli.service
mas_legacy_backup_path: /var/backups/matrix-mas-legacy
# Keep config sections of the previous install that this role does not manage (clients, upstream providers, ...)
mas_legacy_preserve_config: true
