---

- name: Fail if not debian
  ansible.builtin.fail:
    msg: debrepo installation method only works on debian. Use another synapse_install_method or use debian
  when: ansible_os_family != "Debian"

- name: Ensure synapse dependencies are installed
  ansible.builtin.apt:
    name:
      - lsb-release
      - wget
      - apt-transport-https
      - python3-debian
      - python3-pysaml2
      - python3-psycopg2
      - acl
    state: present

- name: Ensure legacy matrix.org repo entry is removed
  ansible.builtin.apt_repository:
    repo: deb https://packages.matrix.org/debian/ {{ ansible_distribution_release }} main
    state: absent

- name: Ensure matrix.org repo is enabled
  ansible.builtin.deb822_repository:
    name: matrix-org
    types: deb
    uris: https://packages.matrix.org/debian/
    suites: "{{ ansible_distribution_release }}"
    components: main
    signed_by: https://packages.matrix.org/debian/matrix-org-archive-keyring.gpg
    state: present
  register: synapse_matrix_org_repo

- name: Update apt cache if repo changed  # noqa: no-handler
  ansible.builtin.apt:
    update_cache: true
  when: synapse_matrix_org_repo is changed
>>>>>>> master

- name: Ensure synapse is installed
  ansible.builtin.apt:
    name: matrix-synapse-py3
    state: "{{ 'latest' if synapse_ensure_latest else 'present' }}"


- name: Ensure redis in installed for workers
  ansible.builtin.apt:
    name: redis-server
    state: present
  when: synapse_workers is defined
